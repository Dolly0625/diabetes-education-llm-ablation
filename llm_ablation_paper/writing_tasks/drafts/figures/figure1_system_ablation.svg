<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0369a1"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#991b1b"/>
    </marker>
  </defs>

  <!-- Border -->
  <rect x="1" y="1" width="958" height="598" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ==================== HEADER ==================== -->
  <text x="20" y="32" font-size="21.0" font-weight="bold" fill="#0f172a">Panel (a): 系統執行期管線與工具調用架構 (Runtime Pipeline)</text>
  <text x="615" y="32" font-size="21.0" font-weight="bold" fill="#0f172a">Panel (b): 逐層消融矩陣 (Ablation Matrix)</text>

  <!-- Panel Divider Line -->
  <line x1="595" y1="12" x2="595" y2="588" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- ==================== PANEL (a) ==================== -->

  <!-- 1. Perception Input -->
  <g transform="translate(20, 52)">
    <rect width="165" height="46" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="82.5" y="21" font-size="18.0" font-weight="bold" fill="#1e293b" text-anchor="middle">感知輸入 (Input)</text>
    <text x="82.5" y="38" font-size="15.0" fill="#475569" text-anchor="middle">文字 / 語音 / 藥袋</text>
  </g>

  <!-- Arrow Perception -> Input Guard -->
  <path d="M 102.5 98 L 102.5 120" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-slate)"/>

  <!-- 2. Input Guard [Fixed ON] -->
  <g transform="translate(18, 122)">
    <rect width="170" height="52" rx="5" fill="#ffffff" stroke="#991b1b" stroke-width="1.6"/>
    <text x="85" y="22" font-size="18.0" font-weight="bold" fill="#991b1b" text-anchor="middle">Input Guard [固定啟用]</text>
    <text x="85" y="42" font-size="15.0" fill="#991b1b" text-anchor="middle">攔截提示注入與自傷危機</text>
  </g>

  <!-- Arrow Input Guard -> Block -->
  <path d="M 188 148 L 228 148" fill="none" stroke="#991b1b" stroke-width="1.6" marker-end="url(#arr-red)"/>
  <text x="208" y="140" font-size="15.0" font-weight="bold" fill="#991b1b" text-anchor="middle">阻斷</text>

  <!-- Block Outcome Box -->
  <g transform="translate(230, 125)">
    <rect width="175" height="46" rx="4" fill="#ffffff" stroke="#991b1b" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="87.5" y="20" font-size="15.0" font-weight="bold" fill="#991b1b" text-anchor="middle">COMMON_INPUT_BLOCK</text>
    <text x="87.5" y="37" font-size="15.0" fill="#64748b" text-anchor="middle">(終止回覆 / 獨立報告)</text>
  </g>

  <!-- Arrow Input Guard -> Memory (Pass) -->
  <path d="M 102.5 174 L 102.5 200" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <text x="110" y="192" font-size="15.0" font-weight="bold" fill="#334155">放行</text>

  <!-- 3. Memory & Patient State -->
  <g transform="translate(18, 202)">
    <rect width="170" height="50" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="85" y="22" font-size="18.0" font-weight="bold" fill="#1e293b" text-anchor="middle">長期記憶 (Memory)</text>
    <text x="85" y="40" font-size="15.0" fill="#475569" text-anchor="middle">抽取病患事實/用藥/血糖</text>
  </g>

  <!-- Arrow Memory -> S1 Decision -->
  <path d="M 102.5 252 L 102.5 280" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-slate)"/>

  <!-- 4. S1 Switch Decision Diamond -->
  <g transform="translate(102.5, 298)">
    <polygon points="0,-18 30,0 0,18 -30,0" fill="#f0f7ff" stroke="#0369a1" stroke-width="1.5"/>
    <text x="0" y="5" font-size="15.0" font-weight="bold" fill="#0369a1" text-anchor="middle">S1?</text>
  </g>
  <text x="142" y="295" font-size="15.0" font-weight="bold" fill="#0369a1">enable_planner</text>

  <!-- S1 ON Arrow -> Planner -->
  <path d="M 102.5 316 L 102.5 348" fill="none" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="110" y="337" font-size="15.0" font-weight="bold" fill="#0369a1">ON</text>

  <!-- Clinical Planner Box -->
  <g transform="translate(18, 350)">
    <rect width="170" height="64" rx="5" fill="#ffffff" stroke="#0369a1" stroke-width="1.8"/>
    <text x="85" y="24" font-size="18.0" font-weight="bold" fill="#0369a1" text-anchor="middle">臨床規劃員 (Planner)</text>
    <text x="85" y="43" font-size="15.0" fill="#334155" text-anchor="middle">意圖判定與槽位缺口盤點</text>
    <text x="85" y="57" font-size="15.0" fill="#64748b" text-anchor="middle">gemini-3.5-flash-lite (0.1)</text>
  </g>

  <!-- S1 OFF Bypass (A) -->
  <path d="M 72.5 298 L 8 298 L 8 470 L 225 470 L 225 385 L 245 385" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-slate)"/>
  <text x="12" y="325" font-size="15.0" font-weight="bold" fill="#64748b">OFF (A 直通)</text>

  <!-- Guidance Arrow: Planner -> Talker -->
  <path d="M 188 382 L 245 382" fill="none" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="216" y="374" font-size="15.0" font-weight="bold" fill="#0369a1" text-anchor="middle">臨床導引</text>

  <!-- State Arrow from Memory to S2 Tool Gate -->
  <path d="M 188 227 L 245 227" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <text x="216" y="219" font-size="15.0" fill="#334155" text-anchor="middle">病患狀態</text>

  <!-- 5. S2 Tool Gate Box -->
  <g transform="translate(247, 196)">
    <rect width="158" height="62" rx="5" fill="#f0f7ff" stroke="#0369a1" stroke-width="1.5"/>
    <text x="79" y="23" font-size="18.0" font-weight="bold" fill="#0369a1" text-anchor="middle">S2: 動態工具門禁</text>
    <text x="79" y="41" font-size="15.0" fill="#0369a1" text-anchor="middle">ON(C,D): 動態暴露過濾</text>
    <text x="79" y="55" font-size="15.0" fill="#64748b" text-anchor="middle">OFF(A,B): 候選工具全暴露</text>
  </g>

  <!-- Allowed Tools to Talker -->
  <path d="M 326 258 L 326 326" fill="none" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="334" y="295" font-size="15.0" font-weight="bold" fill="#0369a1">可見工具清單</text>

  <!-- 6. Controlled External Tools (Tools Execution) in UPPER RIGHT -->
  <g transform="translate(425, 185)">
    <rect width="158" height="74" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="79" y="22" font-size="18.0" font-weight="bold" fill="#1e293b" text-anchor="middle">受控外部工具 (Tools)</text>
    <text x="8" y="42" font-size="15.0" fill="#334155">• search_handbook</text>
    <text x="8" y="58" font-size="15.0" fill="#334155">• generate_visit_summary</text>
    <text x="8" y="70" font-size="15.0" fill="#64748b">(2工具 Schema 雜湊鎖定)</text>
  </g>

  <!-- 7. Talker LLM Core -->
  <g transform="translate(247, 328)">
    <rect width="215" height="92" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2.0"/>
    <text x="107.5" y="26" font-size="18.5" font-weight="bold" fill="#0f172a" text-anchor="middle">衛教生成層 (Talker LLM)</text>
    <text x="107.5" y="47" font-size="15.2" fill="#334155" text-anchor="middle">gemini-3.5-flash-lite (temp 0.3)</text>
    <text x="107.5" y="65" font-size="15.0" fill="#475569" text-anchor="middle">護理師共感衛教提示詞</text>
    <text x="107.5" y="83" font-size="15.0" font-weight="bold" fill="#0369a1" text-anchor="middle">自主決定是否調用外部工具</text>
  </g>

  <!-- Two-way arrows Talker <-> Tools -->
  <!-- Tool Call: Talker -> Tools (Upward) -->
  <path d="M 462 345 L 485 345 L 485 261" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <text x="492" y="305" font-size="15.0" font-weight="bold" fill="#475569">tool call</text>

  <!-- Tool Result: Tools -> Talker (Downward) -->
  <path d="M 535 259 L 535 375 L 464 375" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <text x="542" y="318" font-size="15.0" font-weight="bold" fill="#475569">tool result</text>
  <text x="542" y="335" font-size="15.0" fill="#64748b">(回傳證據)</text>

  <!-- Talker to S3 Switch (Downward) -->
  <path d="M 354 420 L 354 445" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-slate)"/>

  <!-- S3 Decision Diamond -->
  <g transform="translate(354, 462)">
    <polygon points="0,-16 22,0 0,16 -22,0" fill="#f0f7ff" stroke="#0369a1" stroke-width="1.5"/>
    <text x="0" y="5" font-size="15.0" font-weight="bold" fill="#0369a1" text-anchor="middle">S3?</text>
  </g>

  <!-- S3 ON -> Output Guard (Downward) -->
  <path d="M 354 478 L 354 502" fill="none" stroke="#991b1b" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="362" y="492" font-size="15.0" font-weight="bold" fill="#991b1b">ON (D)</text>

  <!-- S3 OFF Bypass -> Passthrough to Response (Right side loop) -->
  <path d="M 376 462 L 530 462 L 530 545 L 485 545" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-slate)"/>
  <text x="385" y="454" font-size="15.0" font-weight="bold" fill="#64748b">OFF (A-C: 直通不檢查)</text>

  <!-- Output Guard Box -->
  <g transform="translate(262, 504)">
    <rect width="185" height="52" rx="5" fill="#ffffff" stroke="#991b1b" stroke-width="1.6"/>
    <text x="92.5" y="22" font-size="18.0" font-weight="bold" fill="#991b1b" text-anchor="middle">S3: 輸出熔斷網 (Guard)</text>
    <text x="92.5" y="39" font-size="15.0" fill="#991b1b" text-anchor="middle">攔截調藥/確診/宣稱 (覆寫)</text>
  </g>

  <!-- Output Guard -> Response -->
  <path d="M 447 530 L 480 530" fill="none" stroke="#991b1b" stroke-width="1.8" marker-end="url(#arr-red)"/>

  <!-- Final Response -->
  <g transform="translate(482, 506)">
    <rect width="95" height="48" rx="5" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
    <text x="47.5" y="21" font-size="18.0" font-weight="bold" fill="#1e293b" text-anchor="middle">最終輸出</text>
    <text x="47.5" y="38" font-size="15.0" fill="#475569" text-anchor="middle">病患衛教卡</text>
  </g>

  <!-- ==================== PANEL (b) ==================== -->
  <text x="615" y="56" font-size="15.0" font-weight="bold" fill="#0369a1">【唯一差異原則：相鄰條件僅新增一層防線】</text>

  <!-- Table Header -->
  <g transform="translate(615, 68)">
    <rect width="325" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="22" font-size="15.0" font-weight="bold" fill="#1e293b" text-anchor="middle">條件</text>
    <text x="98" y="22" font-size="15.0" font-weight="bold" fill="#0369a1" text-anchor="middle">S1: Planner</text>
    <text x="183" y="22" font-size="15.0" font-weight="bold" fill="#0369a1" text-anchor="middle">S2: Gate</text>
    <text x="272" y="22" font-size="15.0" font-weight="bold" fill="#0369a1" text-anchor="middle">S3: Guard</text>
  </g>

  <!-- Row A -->
  <g transform="translate(615, 104)">
    <rect width="325" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="19" font-size="18.0" font-weight="bold" fill="#334155" text-anchor="middle">A</text>
    <text x="30" y="32" font-size="15.0" fill="#64748b" text-anchor="middle">(基準組)</text>
    <rect x="73" y="8" width="50" height="23" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="98" y="24" font-size="15.0" font-weight="bold" fill="#64748b" text-anchor="middle">OFF</text>
    <rect x="158" y="8" width="50" height="23" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="183" y="24" font-size="15.0" font-weight="bold" fill="#64748b" text-anchor="middle">OFF</text>
    <rect x="247" y="8" width="50" height="23" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="272" y="24" font-size="15.0" font-weight="bold" fill="#64748b" text-anchor="middle">OFF</text>
  </g>

  <!-- Step arrow A -> B -->
  <path d="M 632 144 L 632 154" fill="none" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <text x="644" y="152" font-size="15.0" font-weight="bold" fill="#0369a1">+ 結構化規劃與臨床導引</text>

  <!-- Row B -->
  <g transform="translate(615, 157)">
    <rect width="325" height="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="19" font-size="18.0" font-weight="bold" fill="#0369a1" text-anchor="middle">B</text>
    <text x="30" y="32" font-size="15.0" fill="#0369a1" text-anchor="middle">(+規劃員)</text>
    <rect x="73" y="8" width="50" height="23" rx="3" fill="#f0f7ff" stroke="#0369a1"/>
    <text x="98" y="24" font-size="15.0" font-weight="bold" fill="#0369a1" text-anchor="middle">ON</text>
    <rect x="158" y="8" width="50" height="23" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="183" y="24" font-size="15.0" font-weight="bold" fill="#64748b" text-anchor="middle">OFF</text>
    <rect x="247" y="8" width="50" height="23" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="272" y="24" font-size="15.0" font-weight="bold" fill="#64748b" text-anchor="middle">OFF</text>
  </g>

  <!-- Step arrow B -> C -->
  <path d="M 632 197 L 632 207" fill="none" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <text x="644" y="205" font-size="15.0" font-weight="bold" fill="#0369a1">+ 依狀態之動態工具門禁</text>

  <!-- Row C -->
  <g transform="translate(615, 210)">
    <rect width="325" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="19" font-size="18.0" font-weight="bold" fill="#0369a1" text-anchor="middle">C</text>
    <text x="30" y="32" font-size="15.0" fill="#0369a1" text-anchor="middle">(+工具閥門)</text>
    <rect x="73" y="8" width="50" height="23" rx="3" fill="#f0f7ff" stroke="#0369a1"/>
    <text x="98" y="24" font-size="15.0" font-weight="bold" fill="#0369a1" text-anchor="middle">ON</text>
    <rect x="158" y="8" width="50" height="23" rx="3" fill="#f0f7ff" stroke="#0369a1"/>
    <text x="183" y="24" font-size="15.0" font-weight="bold" fill="#0369a1" text-anchor="middle">ON</text>
    <rect x="247" y="8" width="50" height="23" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="272" y="24" font-size="15.0" font-weight="bold" fill="#64748b" text-anchor="middle">OFF</text>
  </g>

  <!-- Step arrow C -> D -->
  <path d="M 632 250 L 632 260" fill="none" stroke="#991b1b" stroke-width="1.6" marker-end="url(#arr-red)"/>
  <text x="644" y="258" font-size="15.0" font-weight="bold" fill="#991b1b">+ 輸出違規攔截與安全覆寫</text>

  <!-- Row D -->
  <g transform="translate(615, 263)">
    <rect width="325" height="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="19" font-size="18.0" font-weight="bold" fill="#1e293b" text-anchor="middle">D</text>
    <text x="30" y="32" font-size="15.0" fill="#991b1b" text-anchor="middle">(+輸出熔斷)</text>
    <rect x="73" y="8" width="50" height="23" rx="3" fill="#f0f7ff" stroke="#0369a1"/>
    <text x="98" y="24" font-size="15.0" font-weight="bold" fill="#0369a1" text-anchor="middle">ON</text>
    <rect x="158" y="8" width="50" height="23" rx="3" fill="#f0f7ff" stroke="#0369a1"/>
    <text x="183" y="24" font-size="15.0" font-weight="bold" fill="#0369a1" text-anchor="middle">ON</text>
    <!-- S3 ON discrete badge -->
    <rect x="247" y="8" width="50" height="23" rx="3" fill="#ffffff" stroke="#991b1b" stroke-width="1.6"/>
    <text x="272" y="24" font-size="15.0" font-weight="bold" fill="#991b1b" text-anchor="middle">ON</text>
  </g>

  <!-- Invariants Box -->
  <g transform="translate(615, 314)">
    <rect width="325" height="262" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="325" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect y="22" width="325" height="8" fill="#f8fafc"/>
    <text x="162.5" y="21" font-size="15.5" font-weight="bold" fill="#1e293b" text-anchor="middle">實驗嚴格控制變項與不變量 (Invariants)</text>

    <!-- 1. Input Guard -->
    <circle cx="16" cy="46" r="3.5" fill="#991b1b"/>
    <text x="26" y="50" font-size="15.0" font-weight="bold" fill="#0f172a">四組共同基礎 (固定啟用 / 不消融)：</text>
    <text x="26" y="68" font-size="15.0" fill="#475569">• Input Guard: 全程啟用阻斷提示注入與自傷；</text>
    <text x="34" y="85" font-size="15.0" fill="#64748b">阻斷案例獨立報告 (sanity check) 不計效果</text>

    <line x1="12" y1="98" x2="313" y2="98" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 2. Auxiliaries Fixed OFF -->
    <circle cx="16" cy="116" r="3.5" fill="#475569"/>
    <text x="26" y="120" font-size="15.0" font-weight="bold" fill="#0f172a">三項生產輔助 (主消融固定 OFF)：</text>
    <text x="26" y="139" font-size="15.0" fill="#475569">• 關閉前置強制檢索 (enable_forced_retrieval)</text>
    <text x="26" y="156" font-size="15.0" fill="#475569">• 關閉停藥警語追加與問句截斷後處理</text>

    <line x1="12" y1="169" x2="313" y2="169" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 3. Model & Frozen Fingerprints -->
    <circle cx="16" cy="188" r="3.5" fill="#0369a1"/>
    <text x="26" y="192" font-size="15.0" font-weight="bold" fill="#0f172a">模型參數與設定指紋 (嚴格凍結)：</text>
    <text x="26" y="211" font-size="15.0" fill="#475569">• Talker/Planner: gemini-3.5-flash-lite (0.3/0.1)</text>
    <text x="26" y="228" font-size="15.0" fill="#475569">• Judge: gemini-3.7-flash (0.0, 雙評分無tie)</text>
    <text x="26" y="246" font-size="15.0" fill="#475569">• 92 軌跡/204 回合 (固定腳本無事實漂移)</text>
    <text x="26" y="262" font-size="15.0" fill="#64748b">• 5 枚凍結指紋與 2 工具 schema 雜湊鎖定</text>
  </g>
</svg>
