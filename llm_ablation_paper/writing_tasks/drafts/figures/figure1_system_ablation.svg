<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 680" width="1160" height="680" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0369a1" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1160" height="680" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- PANEL (a): Runtime Flow & Dynamic Tool-Use Architecture                   -->
  <!-- ========================================================================= -->
  <rect x="20" y="20" width="700" height="640" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="20" y="20" width="700" height="42" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="21" y="50" width="698" height="12" fill="#f1f5f9"/>
  <text x="35" y="47" font-size="16" font-weight="bold" fill="#0f172a">Panel (a): 系統執行期管線與工具調用架構 (Runtime Execution Flow)</text>

  <!-- Input Node -->
  <g transform="translate(60, 75)">
    <rect width="210" height="48" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="105" y="20" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">感知層輸入 (Perception)</text>
    <text x="105" y="38" font-size="11" fill="#475569" text-anchor="middle">文字 / 台語語音 (ASR) / 藥袋 (OCR)</text>
  </g>

  <!-- Flow Arrow: Input -> Input Guard -->
  <path d="M 165 123 L 165 145" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Input Guard Node (Fixed ON) -->
  <g transform="translate(45, 147)">
    <rect width="240" height="56" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="120" y="22" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">Input Guard [四組固定 ON / 不消融]</text>
    <text x="120" y="38" font-size="10.5" fill="#7f1d1d" text-anchor="middle">僅阻斷惡意提示注入與自傷心理危機</text>
    <text x="120" y="50" font-size="9.5" fill="#991b1b" text-anchor="middle">(未實作胸痛等急症正則；阻斷率四組相同)</text>
  </g>

  <!-- Branch: Input Guard Blocked -->
  <path d="M 285 175 L 340 175" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="348" y="172" font-size="10" font-weight="bold" fill="#b91c1c">阻斷 (is_blocked)</text>
  <text x="348" y="185" font-size="9.5" fill="#7f1d1d">COMMON_INPUT_BLOCK (終止回覆)</text>

  <!-- Flow Arrow: Input Guard -> Memory -->
  <path d="M 165 203 L 165 225" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="172" y="217" font-size="9.5" fill="#475569">放行 (Safe Pass)</text>

  <!-- Memory Node -->
  <g transform="translate(50, 227)">
    <rect width="230" height="46" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="115" y="20" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">長期記憶與對話事實 (Memory)</text>
    <text x="115" y="36" font-size="10.5" fill="#475569" text-anchor="middle">抽取病患事實、用藥/血糖/症狀縱向儲存</text>
  </g>

  <!-- S1 Switch Diamond / Fork -->
  <path d="M 165 273 L 165 295" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g transform="translate(95, 297)">
    <rect width="140" height="28" rx="4" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="70" y="18" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">S1: enable_planner ?</text>
  </g>

  <!-- S1 Branch: ON (B, C, D) -> Planner Agent -->
  <path d="M 235 311 L 320 311" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="245" y="305" font-size="10" font-weight="bold" fill="#0369a1">ON (B, C, D)</text>

  <!-- Planner Agent Node -->
  <g transform="translate(322, 280)">
    <rect width="210" height="64" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
    <text x="105" y="20" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">臨床規劃員 (Clinical Planner)</text>
    <text x="105" y="36" font-size="10.5" fill="#0c4a6e" text-anchor="middle">gemini-3.5-flash-lite (temp 0.1)</text>
    <text x="105" y="52" font-size="10" fill="#0369a1" text-anchor="middle">判定核心意圖、槽位缺口、下一步導引</text>
  </g>

  <!-- S1 Branch: OFF (A: Bypass) -->
  <path d="M 105 325 L 105 385" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/>
  <text x="40" y="355" font-size="10" font-weight="bold" fill="#475569">OFF (A: Bypass)</text>
  <text x="40" y="368" font-size="9" fill="#64748b">中立狀態直通</text>

  <!-- Planner to Talker: Guidance -->
  <path d="M 370 344 L 370 375 L 302 375 L 302 387" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text x="315" y="367" font-size="10" font-weight="bold" fill="#0369a1">臨床導引 (Guidance)</text>

  <!-- Planner to Tool Gate State Connection -->
  <path d="M 470 280 L 470 248 L 540 248" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-teal)"/>
  <text x="475" y="242" font-size="9" font-weight="bold" fill="#0f766e">狀態與檢索領域</text>

  <!-- Tool Gate Node (S2) -->
  <g transform="translate(542, 215)">
    <rect width="165" height="78" rx="6" fill="#f0fdf4" stroke="#0f766e" stroke-width="1.8"/>
    <text x="82" y="18" font-size="11.5" font-weight="bold" fill="#0f766e" text-anchor="middle">S2: 動態工具門禁</text>
    <text x="82" y="33" font-size="10" font-weight="bold" fill="#134e4a" text-anchor="middle">enable_dynamic_tool_gate</text>
    <line x1="10" y1="40" x2="155" y2="40" stroke="#ccfbf1" stroke-width="1"/>
    <text x="82" y="53" font-size="9.5" fill="#115e59" text-anchor="middle">ON (C, D): 依狀態動態過濾</text>
    <text x="82" y="68" font-size="9.5" fill="#475569" text-anchor="middle">OFF (A, B): 暴露全部工具</text>
  </g>

  <!-- Tool Gate -> Allowed Tools Schema -> Talker -->
  <path d="M 600 293 L 600 325 L 420 325 L 420 387" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="4 2" marker-end="url(#arrow-teal)"/>
  <text x="428" y="320" font-size="10" font-weight="bold" fill="#0f766e">可見工具清單 (Allowed Tools Schema)</text>

  <!-- Talker LLM Core Node -->
  <g transform="translate(85, 389)">
    <rect width="360" height="74" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="180" y="24" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">衛教生成層 (Talker LLM 生成核心)</text>
    <text x="180" y="44" font-size="11.5" fill="#334155" text-anchor="middle">gemini-3.5-flash-lite (temp 0.3) ｜ 護理師共感衛教提示詞</text>
    <text x="180" y="62" font-size="10.5" fill="#475569" text-anchor="middle">依對話與導引自主生成文字；自主決定是否調用可見工具</text>
  </g>

  <!-- External Tools Box (Right of Talker) -->
  <g transform="translate(485, 385)">
    <rect width="220" height="82" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
    <text x="110" y="19" font-size="12" font-weight="bold" fill="#854d0e" text-anchor="middle">受控外部工具 (Tools)</text>
    <text x="110" y="35" font-size="10" fill="#713f12" text-anchor="middle">由 Talker 自主發起 Function Call 調用</text>
    <line x1="12" y1="41" x2="208" y2="41" stroke="#fef08a" stroke-width="1"/>
    <text x="15" y="56" font-size="10" fill="#854d0e">• 雙軌 RAG: search_handbook (國健署/TFDA)</text>
    <text x="15" y="72" font-size="10" fill="#854d0e">• 門診摘要產卡: generate_visit_summary</text>
  </g>

  <!-- Bidirectional Interaction between Talker and Tools -->
  <!-- 1. Tool Call: Talker -> Tools -->
  <path d="M 445 410 L 483 410" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="464" y="403" font-size="9" font-weight="bold" fill="#b45309" text-anchor="middle">tool call</text>

  <!-- 2. Tool Result: Tools -> Talker -->
  <path d="M 483 440 L 447 440" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="464" y="454" font-size="9" font-weight="bold" fill="#b45309" text-anchor="middle">tool result</text>
  <text x="464" y="465" font-size="8" fill="#78350f" text-anchor="middle">(檢索證據/二次生成)</text>

  <!-- Flow Arrow: Talker -> S3 Switch -->
  <path d="M 230 463 L 230 482" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- S3 Switch Diamond / Fork -->
  <g transform="translate(150, 484)">
    <rect width="160" height="28" rx="4" fill="#f8fafc" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="80" y="18" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">S3: enable_output_guard ?</text>
  </g>

  <!-- S3 Branch: ON (D) -> Output Guard -->
  <path d="M 230 512 L 230 530" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="235" y="524" font-size="9.5" font-weight="bold" fill="#b91c1c">ON (D)</text>

  <!-- Output Guard Node -->
  <g transform="translate(85, 532)">
    <rect width="290" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="145" y="20" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">S3: 輸出熔斷網 (Output Guard)</text>
    <text x="145" y="35" font-size="10.5" fill="#7f1d1d" text-anchor="middle">inspect_output_guard 攔截調藥、確診與神效宣稱</text>
    <text x="145" y="47" font-size="9.5" fill="#991b1b" text-anchor="middle">違規時物理覆蓋為合規安全話術 (Safety Override)</text>
  </g>

  <!-- S3 Branch: OFF (A, B, C: Passthrough) -->
  <path d="M 310 498 L 415 498 L 415 600 L 290 600" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/>
  <text x="420" y="540" font-size="10" font-weight="bold" fill="#475569">OFF (A, B, C: Passthrough)</text>
  <text x="420" y="555" font-size="9" fill="#64748b">Talker 輸出直通不檢查</text>

  <!-- Output Guard -> Final Response -->
  <path d="M 230 584 L 230 602" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Final Response Node -->
  <g transform="translate(90, 604)">
    <rect width="200" height="42" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="100" y="18" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">最終病患端輸出 (Response)</text>
    <text x="100" y="34" font-size="10.5" fill="#166534" text-anchor="middle">LINE 衛教文字回覆 / 就醫備忘錄</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL (b): Incremental Ablation Matrix & Invariants                       -->
  <!-- ========================================================================= -->
  <rect x="740" y="20" width="400" height="640" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="740" y="20" width="400" height="42" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="741" y="50" width="398" height="12" fill="#f1f5f9"/>
  <text x="755" y="47" font-size="16" font-weight="bold" fill="#0f172a">Panel (b): 逐層消融矩陣 (Ablation Matrix)</text>

  <!-- Subtitle -->
  <text x="755" y="82" font-size="11.5" font-weight="bold" fill="#334155">【唯一差異原則：相鄰條件僅新增一層防線】</text>

  <!-- Table Header -->
  <g transform="translate(755, 95)">
    <rect width="370" height="30" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="35" y="20" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">條件</text>
    <text x="115" y="20" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">S1: Planner</text>
    <text x="210" y="20" font-size="11" font-weight="bold" fill="#0f766e" text-anchor="middle">S2: Tool Gate</text>
    <text x="310" y="20" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">S3: Out Guard</text>
  </g>

  <!-- Row A -->
  <g transform="translate(755, 125)">
    <rect width="370" height="45" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="35" y="24" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">A</text>
    <text x="35" y="37" font-size="9" fill="#64748b" text-anchor="middle">(基準組)</text>
    <rect x="85" y="12" width="60" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="115" y="27" font-size="10.5" font-weight="bold" fill="#64748b" text-anchor="middle">OFF</text>
    <rect x="180" y="12" width="60" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="210" y="27" font-size="10.5" font-weight="bold" fill="#64748b" text-anchor="middle">OFF</text>
    <rect x="280" y="12" width="60" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="310" y="27" font-size="10.5" font-weight="bold" fill="#64748b" text-anchor="middle">OFF</text>
  </g>

  <!-- Step arrow A -> B -->
  <path d="M 770 171 L 770 181" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="780" y="179" font-size="9" font-weight="bold" fill="#0284c7">+ 結構化規劃與臨床導引</text>

  <!-- Row B -->
  <g transform="translate(755, 183)">
    <rect width="370" height="45" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="35" y="24" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">B</text>
    <text x="35" y="37" font-size="9" fill="#0369a1" text-anchor="middle">(+規劃員)</text>
    <rect x="85" y="12" width="60" height="22" rx="4" fill="#dbeafe" stroke="#0284c7"/>
    <text x="115" y="27" font-size="10.5" font-weight="bold" fill="#0369a1" text-anchor="middle">ON</text>
    <rect x="180" y="12" width="60" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="210" y="27" font-size="10.5" font-weight="bold" fill="#64748b" text-anchor="middle">OFF</text>
    <rect x="280" y="12" width="60" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="310" y="27" font-size="10.5" font-weight="bold" fill="#64748b" text-anchor="middle">OFF</text>
  </g>

  <!-- Step arrow B -> C -->
  <path d="M 770 229 L 770 239" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
  <text x="780" y="237" font-size="9" font-weight="bold" fill="#0f766e">+ 依狀態之動態工具暴露與議程門禁</text>

  <!-- Row C -->
  <g transform="translate(755, 241)">
    <rect width="370" height="45" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="35" y="24" font-size="13" font-weight="bold" fill="#0f766e" text-anchor="middle">C</text>
    <text x="35" y="37" font-size="9" fill="#0f766e" text-anchor="middle">(+工具閥門)</text>
    <rect x="85" y="12" width="60" height="22" rx="4" fill="#dbeafe" stroke="#0284c7"/>
    <text x="115" y="27" font-size="10.5" font-weight="bold" fill="#0369a1" text-anchor="middle">ON</text>
    <rect x="180" y="12" width="60" height="22" rx="4" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="210" y="27" font-size="10.5" font-weight="bold" fill="#0f766e" text-anchor="middle">ON</text>
    <rect x="280" y="12" width="60" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="310" y="27" font-size="10.5" font-weight="bold" fill="#64748b" text-anchor="middle">OFF</text>
  </g>

  <!-- Step arrow C -> D -->
  <path d="M 770 287 L 770 297" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="780" y="295" font-size="9" font-weight="bold" fill="#dc2626">+ 輸出違規攔截與安全覆寫</text>

  <!-- Row D -->
  <g transform="translate(755, 299)">
    <rect width="370" height="45" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
    <text x="35" y="24" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">D</text>
    <text x="35" y="37" font-size="9" fill="#b91c1c" text-anchor="middle">(+輸出熔斷)</text>
    <rect x="85" y="12" width="60" height="22" rx="4" fill="#dbeafe" stroke="#0284c7"/>
    <text x="115" y="27" font-size="10.5" font-weight="bold" fill="#0369a1" text-anchor="middle">ON</text>
    <rect x="180" y="12" width="60" height="22" rx="4" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="210" y="27" font-size="10.5" font-weight="bold" fill="#0f766e" text-anchor="middle">ON</text>
    <rect x="280" y="12" width="60" height="22" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="310" y="27" font-size="10.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">ON</text>
  </g>

  <!-- Invariants & Rigorous Controls Section -->
  <g transform="translate(755, 360)">
    <rect width="370" height="280" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect width="370" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <rect y="20" width="370" height="8" fill="#f1f5f9"/>
    <text x="185" y="19" font-size="11.5" font-weight="bold" fill="#1e293b" text-anchor="middle">實驗嚴格控制變項與不變量 (Controlled Invariants)</text>

    <!-- 1. Input Guard -->
    <circle cx="20" cy="45" r="4" fill="#b91c1c"/>
    <text x="32" y="49" font-size="10.5" font-weight="bold" fill="#0f172a">四組共同基礎設施 (固定 ON / 不消融)：</text>
    <text x="32" y="65" font-size="9.8" fill="#475569">• Input Guard: 四組全程固定啟用，攔截提示注入與自傷；</text>
    <text x="40" y="79" font-size="9.3" fill="#64748b">觸發案例獨立報告 (sanity check)，不計入 A–D 效果。</text>

    <line x1="15" y1="89" x2="355" y2="89" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 2. Auxiliaries Fixed OFF -->
    <circle cx="20" cy="105" r="4" fill="#ca8a04"/>
    <text x="32" y="109" font-size="10.5" font-weight="bold" fill="#0f172a">三項生產輔助行為 (主要消融固定 OFF)：</text>
    <text x="32" y="125" font-size="9.8" fill="#475569">• enable_forced_retrieval: 關閉前置強制檢索與注入</text>
    <text x="32" y="140" font-size="9.8" fill="#475569">• enable_fixed_warning_append: 關閉停藥固定警語追加</text>
    <text x="32" y="155" font-size="9.8" fill="#475569">• enable_question_budget_postproc: 關閉問句截斷與濾 emoji</text>

    <line x1="15" y1="165" x2="355" y2="165" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 3. Model & Frozen Fingerprints -->
    <circle cx="20" cy="181" r="4" fill="#0284c7"/>
    <text x="32" y="185" font-size="10.5" font-weight="bold" fill="#0f172a">模型參數與設定指紋 (嚴格凍結)：</text>
    <text x="32" y="201" font-size="9.8" fill="#475569">• Talker / Planner: gemini-3.5-flash-lite (temp 0.3 / 0.1)</text>
