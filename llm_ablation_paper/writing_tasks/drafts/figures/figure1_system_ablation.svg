<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0369a1"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#991b1b"/>
    </marker>
  </defs>

  <!-- Outer Border -->
  <rect x="1" y="1" width="858" height="408" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Main Title -->
  <text x="24" y="27" font-size="18.0" font-weight="bold" fill="#0f172a">Figure 1: 衛教對話系統執行期管線與受控工具調用架構 (Runtime Pipeline &amp; Tool Flow)</text>

  <!-- ==================== TOP TRACK: S2 TOOL GATE & CONTROLLED TOOLS ==================== -->
  <!-- [S2] Dynamic Tool Gate Box -->
  <g transform="translate(365, 44)">
    <rect width="180" height="48" rx="4" fill="#f0f7ff" stroke="#0369a1" stroke-width="1.6"/>
    <text x="90" y="20" font-size="15.5" font-weight="bold" fill="#0369a1" text-anchor="middle">S2: 動態工具門禁 (Gate)</text>
    <text x="90" y="38" font-size="14.0" fill="#0369a1" text-anchor="middle">ON(C,D): 動態過濾 ┆ OFF(A,B): 全暴露</text>
  </g>

  <!-- Controlled Tools Box -->
  <g transform="translate(625, 44)">
    <rect width="160" height="48" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
    <text x="80" y="20" font-size="15.5" font-weight="bold" fill="#1e293b" text-anchor="middle">受控外部工具 (Tools)</text>
    <text x="80" y="38" font-size="14.0" fill="#475569" text-anchor="middle">雙軌 RAG / 門診摘要</text>
  </g>

  <!-- ==================== MAIN HORIZONTAL PIPELINE (MIDDLE TRACK) ==================== -->

  <!-- 1. Perception Input Box -->
  <g transform="translate(24, 44)">
    <rect width="138" height="44" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="69" y="19" font-size="15.0" font-weight="bold" fill="#1e293b" text-anchor="middle">感知層輸入 (Input)</text>
    <text x="69" y="35" font-size="14.0" fill="#475569" text-anchor="middle">文字 / 語音 / 藥袋</text>
  </g>

  <!-- Arrow: Perception -> Input Guard -->
  <path d="M 93 88 L 93 118" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-slate)"/>

  <!-- 2. Input Guard Box [Fixed ON] -->
  <g transform="translate(24, 120)">
    <rect width="138" height="52" rx="4" fill="#ffffff" stroke="#991b1b" stroke-width="1.8"/>
    <text x="69" y="21" font-size="15.0" font-weight="bold" fill="#991b1b" text-anchor="middle">Input Guard [固定 ON]</text>
    <text x="69" y="40" font-size="14.0" fill="#991b1b" text-anchor="middle">提示注入與自傷阻斷</text>
  </g>

  <!-- Arrow: Input Guard -> COMMON_INPUT_BLOCK (Down) -->
  <path d="M 93 172 L 93 212" fill="none" stroke="#991b1b" stroke-width="1.6" marker-end="url(#arr-red)"/>
  <text x="64" y="198" font-size="14.0" font-weight="bold" fill="#991b1b">阻斷</text>

  <!-- Block Outcome Box -->
  <g transform="translate(24, 214)">
    <rect width="138" height="46" rx="4" fill="#ffffff" stroke="#991b1b" stroke-width="1.4" stroke-dasharray="4,3"/>
    <text x="69" y="20" font-size="14.0" font-weight="bold" fill="#991b1b" text-anchor="middle">COMMON_INPUT_BLOCK</text>
    <text x="69" y="36" font-size="13.5" fill="#64748b" text-anchor="middle">(終止回覆 / 獨立報告)</text>
  </g>

  <!-- Arrow: Input Guard -> Memory (Pass / Right) -->
  <path d="M 162 146 L 214 146" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <text x="188" y="136" font-size="14.0" font-weight="bold" fill="#334155" text-anchor="middle">放行</text>

  <!-- 3. Long-term Memory Box -->
  <g transform="translate(216, 120)">
    <rect width="134" height="52" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="67" y="21" font-size="15.0" font-weight="bold" fill="#1e293b" text-anchor="middle">長期記憶 (Memory)</text>
    <text x="67" y="40" font-size="14.0" fill="#475569" text-anchor="middle">跨輪病患狀態累積</text>
  </g>

  <!-- Path: Memory -> S2 Gate (Up & Right) -->
  <path d="M 283 120 L 283 68 L 363 68" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <text x="296" y="60" font-size="14.0" fill="#334155">病患狀態</text>

  <!-- Arrow: Memory -> Talker (S1 OFF Passthrough / Right) -->
  <path d="M 350 146 L 442 146" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-slate)"/>
  <text x="396" y="136" font-size="14.0" font-weight="bold" fill="#64748b" text-anchor="middle">OFF (直通)</text>

  <!-- 4. Talker LLM Generation Box (Center Core) -->
  <g transform="translate(444, 116)">
    <rect width="180" height="66" rx="5" fill="#ffffff" stroke="#0f172a" stroke-width="2.0"/>
    <text x="90" y="23" font-size="16.0" font-weight="bold" fill="#0f172a" text-anchor="middle">衛教生成層 (Talker LLM)</text>
    <text x="90" y="41" font-size="14.0" fill="#334155" text-anchor="middle">護理師共感衛教核心</text>
    <text x="90" y="57" font-size="14.0" font-weight="bold" fill="#0369a1" text-anchor="middle">自主決定是否調用工具</text>
  </g>

  <!-- S2 Gate -> Talker: Allowed Tools Schema (Downward) -->
  <path d="M 460 92 L 460 114" fill="none" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="452" y="106" font-size="14.0" font-weight="bold" fill="#0369a1" text-anchor="end">可見工具</text>

  <!-- Tool Call: Talker -> Tools (Upward) -->
  <path d="M 570 116 L 570 102 L 650 102 L 650 94" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <text x="585" y="97" font-size="14.0" font-weight="bold" fill="#475569">tool call</text>

  <!-- Tool Result: Tools -> Talker (Downward) -->
  <path d="M 700 92 L 700 106 L 610 106 L 610 114" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <text x="706" y="104" font-size="14.0" font-weight="bold" fill="#475569">tool result</text>

  <!-- Arrow: Talker -> Response (S3 OFF Passthrough / Right) -->
  <path d="M 624 146 L 722 146" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-slate)"/>
  <text x="673" y="136" font-size="14.0" font-weight="bold" fill="#64748b" text-anchor="middle">OFF (直通)</text>

  <!-- 5. Final Response Box (Right) -->
  <g transform="translate(724, 120)">
    <rect width="120" height="52" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
    <text x="60" y="21" font-size="15.0" font-weight="bold" fill="#1e293b" text-anchor="middle">最終病患端輸出</text>
    <text x="60" y="40" font-size="14.0" fill="#475569" text-anchor="middle">衛教回覆 / 備忘錄</text>
  </g>

  <!-- ==================== BOTTOM TRACK: S1 PLANNER & S3 OUTPUT GUARD ==================== -->

  <!-- Memory -> S1 Planner Branch (Down & Right) -->
  <path d="M 283 172 L 283 238 L 338 238" fill="none" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="290" y="205" font-size="14.0" font-weight="bold" fill="#0369a1">S1 ON</text>

  <!-- [S1] Clinical Planner Box -->
  <g transform="translate(340, 214)">
    <rect width="170" height="50" rx="4" fill="#ffffff" stroke="#0369a1" stroke-width="1.8"/>
    <text x="85" y="21" font-size="15.5" font-weight="bold" fill="#0369a1" text-anchor="middle">S1: 臨床規劃員 (Planner)</text>
    <text x="85" y="39" font-size="14.0" fill="#334155" text-anchor="middle">意圖定界與導引 (B, C, D)</text>
  </g>

  <!-- Planner Guidance -> Talker (Upward) -->
  <path d="M 480 214 L 480 184" fill="none" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="488" y="202" font-size="14.0" font-weight="bold" fill="#0369a1">臨床導引</text>

  <!-- Talker -> S3 Output Guard Branch (Down & Right) -->
  <path d="M 580 182 L 580 238 L 608 238" fill="none" stroke="#991b1b" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="586" y="205" font-size="14.0" font-weight="bold" fill="#991b1b">S3 ON</text>

  <!-- [S3] Output Guard Box -->
  <g transform="translate(610, 214)">
    <rect width="168" height="50" rx="4" fill="#ffffff" stroke="#991b1b" stroke-width="1.8"/>
    <text x="84" y="21" font-size="15.5" font-weight="bold" fill="#991b1b" text-anchor="middle">S3: 輸出熔斷網 (Guard)</text>
    <text x="84" y="39" font-size="14.0" fill="#991b1b" text-anchor="middle">違規攔截與覆寫 (D 組)</text>
  </g>

  <!-- Output Guard -> Final Response (Right & Up) -->
  <path d="M 778 238 L 795 238 L 795 174" fill="none" stroke="#991b1b" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="802" y="210" font-size="14.0" font-weight="bold" fill="#991b1b">安全覆寫</text>

  <!-- ==================== LEGEND / FOOTER ==================== -->
  <g transform="translate(24, 356)">
    <rect width="820" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="19" font-size="14.0" font-weight="bold" fill="#0f172a">圖例說明：</text>
    <line x1="90" y1="14" x2="116" y2="14" stroke="#0369a1" stroke-width="1.8"/>
    <text x="122" y="19" font-size="14.0" fill="#0369a1">主幹與消融控制</text>
    <line x1="242" y1="14" x2="268" y2="14" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="274" y="19" font-size="14.0" fill="#64748b">OFF 直通旁路 (Bypass)</text>
    <line x1="432" y1="14" x2="458" y2="14" stroke="#991b1b" stroke-width="1.8"/>
    <text x="464" y="19" font-size="14.0" fill="#991b1b">安全護欄與覆寫</text>
    <text x="612" y="19" font-size="14.0" fill="#475569">消融開關矩陣詳見 Table 1</text>
  </g>
</svg>
